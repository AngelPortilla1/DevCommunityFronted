<svg viewBox="0 0 1260 660" xmlns="http://www.w3.org/2000/svg" style="background:#0f1117" font-family="system-ui,sans-serif">
  <defs>
    <marker id="arr"    markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4a5080"/></marker>
    <marker id="arr-em" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6c7bff"/></marker>
    <marker id="arr-sec"markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker>
    <marker id="arr-dsh"markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker>
  </defs>

  <!-- Angular App boundary -->
  <rect x="160" y="30" width="1060" height="610" rx="14" fill="none" stroke="#2e3155" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="172" y="50" font-size="10" fill="#9095b8">Angular Application</text>

  <!-- Auth Layer boundary -->
  <rect x="385" y="58" width="420" height="80" rx="10" fill="rgba(239,68,68,0.04)" stroke="#9b2c2c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="397" y="74" font-size="10" fill="#f87171">Auth Layer</text>

  <!-- Feature Pages boundary -->
  <rect x="610" y="178" width="160" height="344" rx="10" fill="rgba(108,123,255,0.04)" stroke="#6c7bff" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="622" y="196" font-size="10" fill="#6c7bff">Feature Pages</text>

  <!-- CONNECTIONS -->
  <!-- User → Router -->
  <line x1="150" y1="348" x2="218" y2="348" stroke="#6c7bff" stroke-width="2" marker-end="url(#arr-em)"/>
  <text x="158" y="342" font-size="9" fill="#9095b8">navigate</text>

  <!-- Router → Auth Pages -->
  <path d="M285,320 L285,216" stroke="#4a5080" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="290" y="268" font-size="9" fill="#9095b8">public routes</text>

  <!-- Router → AuthGuard -->
  <path d="M350,348 L388,228" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arr-sec)"/>
  <text x="355" y="302" font-size="9" fill="#9095b8">canActivate</text>

  <!-- AuthGuard → AuthService -->
  <line x1="452" y1="200" x2="452" y2="136" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arr-sec)"/>
  <text x="458" y="172" font-size="9" fill="#9095b8">isLoggedIn()</text>

  <!-- AuthService → JwtInterceptor -->
  <line x1="550" y1="108" x2="638" y2="108" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arr-sec)"/>
  <text x="572" y="102" font-size="9" fill="#9095b8">token</text>

  <!-- AuthGuard → MainLayout -->
  <path d="M452,256 L452,340" stroke="#6c7bff" stroke-width="2" fill="none" marker-end="url(#arr-em)"/>
  <text x="458" y="304" font-size="9" fill="#9095b8">allow</text>

  <!-- MainLayout → Feature pages (dashed) -->
  <path d="M550,368 L612,224" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-dsh)"/>
  <path d="M550,368 L612,284" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-dsh)"/>
  <path d="M550,368 L612,344" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-dsh)"/>
  <path d="M550,368 L612,404" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-dsh)"/>
  <path d="M550,368 L612,464" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-dsh)"/>
  <path d="M550,368 L612,524" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-dsh)"/>

