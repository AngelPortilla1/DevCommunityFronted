  <path d="M703,136 L703,200 L920,200 L920,298" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arr-sec)"/>
  <text x="790" y="194" font-size="9" fill="#9095b8">Bearer token</text>

