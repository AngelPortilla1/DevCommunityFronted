  <line x1="722" y1="404" x2="858" y2="194" stroke="#4a5080" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="742" y="296" font-size="9" fill="#9095b8">WS/HTTP</text>

  <!-- Notifications → NotificationService -->
  <line x1="722" y1="464" x2="858" y2="254" stroke="#4a5080" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Saved → SavedService -->
  <line x1="722" y1="524" x2="858" y2="394" stroke="#4a5080" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Services → ApiService -->
  <line x1="925" y1="218" x2="925" y2="298" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-dsh)"/>
  <line x1="940" y1="276" x2="940" y2="298" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-dsh)"/>
  <line x1="925" y1="394" x2="925" y2="356" stroke="#555" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-dsh)"/>

