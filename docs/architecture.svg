  <text x="1133" y="342" text-anchor="middle" font-size="9.5" fill="#9095b8">HTTPS</text>

  <!-- Legend -->
  <rect x="40" y="440" width="100" height="180" rx="8" fill="#1a1d2e" stroke="#2e3155" stroke-width="1"/>
  <text x="50" y="458" font-size="9" fill="#9095b8" font-weight="700">LEYENDA</text>
  <rect x="50" y="466" width="12" height="12" rx="3" fill="#1e2a4a" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="68" y="477" font-size="9" fill="#9095b8">Frontend</text>
  <rect x="50" y="484" width="12" height="12" rx="3" fill="#2e1a1a" stroke="#9b2c2c" stroke-width="1.5"/>
  <text x="68" y="495" font-size="9" fill="#9095b8">Security</text>
  <rect x="50" y="502" width="12" height="12" rx="3" fill="#1a2e1a" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="68" y="513" font-size="9" fill="#9095b8">Service</text>
  <rect x="50" y="520" width="12" height="12" rx="3" fill="#1a2535" stroke="#2563eb" stroke-width="1.5"/>
  <text x="68" y="531" font-size="9" fill="#9095b8">Cloud/API</text>
  <line x1="50" y1="545" x2="80" y2="545" stroke="#6c7bff" stroke-width="2"/>
  <text x="86" y="549" font-size="9" fill="#9095b8">Principal</text>
  <line x1="50" y1="560" x2="80" y2="560" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="86" y="564" font-size="9" fill="#9095b8">Seguridad</text>
  <line x1="50" y1="575" x2="80" y2="575" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="86" y="579" font-size="9" fill="#9095b8">Lazy load</text>
  <text x="50" y="606" font-size="8" fill="#555">Archify v2.17</text>
