  <text x="666" y="423" text-anchor="middle" font-size="11" font-weight="700" fill="#e8eaf6">Notifications</text>
  <text x="666" y="437" text-anchor="middle" font-size="9" fill="#9095b8">/notifications</text>

  <rect x="612" y="454" width="108" height="40" rx="9" fill="#1e2a4a" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="666" y="473" text-anchor="middle" font-size="11" font-weight="700" fill="#e8eaf6">Saved</text>
  <text x="666" y="487" text-anchor="middle" font-size="9" fill="#9095b8">/saved</text>

