  <text x="923" y="210" text-anchor="middle" font-size="9" fill="#9095b8">Chat + WebSocket</text>

  <rect x="858" y="228" width="130" height="48" rx="9" fill="#1a2e1a" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="923" y="250" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e8eaf6">NotificationService</text>
  <text x="923" y="266" text-anchor="middle" font-size="9" fill="#9095b8">Push updates</text>

  <rect x="858" y="298" width="130" height="56" rx="10" fill="#1a2e1a" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="923" y="324" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e8eaf6">ApiService</text>
  <text x="923" y="340" text-anchor="middle" font-size="9.5" fill="#9095b8">HTTP base client</text>

  <rect x="858" y="364" width="130" height="48" rx="9" fill="#1a2e1a" stroke="#2d6a2d" stroke-width="1.5"/>
  <text x="923" y="388" text-anchor="middle" font-size="11" font-weight="700" fill="#e8eaf6">SavedService</text>
  <text x="923" y="404" text-anchor="middle" font-size="9" fill="#9095b8">Bookmarks</text>

